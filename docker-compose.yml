version: '3.8'

services:
  bot:
    # Собирать образ из Dockerfile в текущей директории
    build: .
    # Имя контейнера для удобства
    container_name: code_gen_bot
    # Прочитать переменные окружения из файла .env и передать их в контейнер
    env_file:
      - .env
    # "Пробросить" файлы из хост-машины в контейнер (volumes)
    # Это нужно, чтобы база данных и логи сохранялись между перезапусками контейнера
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./logs:/app/logs
    # Политика перезапуска: перезапускать всегда, кроме случаев, когда мы остановили его вручную
    restart: unless-stopped