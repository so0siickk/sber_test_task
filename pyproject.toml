[tool.poetry]
name = "sber-test-task"
version = "0.1.0"
description = "Telegram bot for collective code generation"
authors = ["Савин Савелий <savin.se@edu.spbstu.ru>"]
readme = "README.md"
packages = [{include = "code_gen_bot", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
aiogram = "^3.2.0"
sqlalchemy = {version = "^2.0.23", extras = ["asyncio"]}
aiosqlite = "^0.19.0"
pydantic-settings = "^2.1.0"
loguru = "^0.7.2"
ruff = "^0.14.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
pytest-cov = "^7.0.0"
pytest-asyncio = "^1.2.0"
ruff = "^0.14.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]